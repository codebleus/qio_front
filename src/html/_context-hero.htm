<section class="context-hero">
  <div class="context-hero__container container">
    <div class="context-hero__content">
      <h1 data-scramble-text="Разработка сайтов" class="context-hero__heading">
        Разработка сайтов
      </h1>
      <p class="context-hero__txt">
        Поможем вашему сайту приносить больше клиентов и продаж. Первый
        результат уже через 4 месяца после старта работы. Интегрируем сайт с
        нужными сервисами и аналитикой. 
      </p>
      <button
        data-anchor="#contextCta"
        type="button"
        class="context-hero__btn btn-alt"
      >
        <div class="liquidGlass-effect"></div>
        <div class="liquidGlass-tint"></div>
        <div class="liquidGlass-shine"></div>
        <span class="btn-alt__txt">Оставить заявку</span>
      </button>
    </div>
    <div class="context-hero__carousel">
      <div class="context-hero__slider swiper">
        <ul class="context-hero__slider-wrapper swiper-wrapper">
          <li class="context-hero__slide slide-context-hero swiper-slide">
            <div class="slide-context-hero__inner">
              <div class="slide-context-hero__phone">
                <div class="slide-context-hero__bg-wrap">
                  <video
                    src="/files/bag-seq-6.mp4"
                    loop
                    muted
                    autoplay
                    playsinline
                    class="slide-context-hero__bg"
                  ></video>
                </div>
              </div>
              <div class="slide-context-hero__desk">
                <div class="slide-context-hero__bg-wrap">
                  <img
                    src="@img/content/amkal.webp"
                    alt=""
                    class="slide-context-hero__bg"
                  />
                </div>
              </div>
            </div>
          </li>
          <li class="context-hero__slide slide-context-hero swiper-slide">
            <div class="slide-context-hero__inner">
              <div class="slide-context-hero__phone">
                <div class="slide-context-hero__bg-wrap">
                  <video
                    src="/files/atlanty.mp4"
                    loop
                    muted
                    autoplay
                    playsinline
                    class="slide-context-hero__bg"
                  ></video>
                </div>
              </div>
              <div class="slide-context-hero__desk">
                <div class="slide-context-hero__bg-wrap">
                  <img
                    src="@img/content/cc-3.webp"
                    alt=""
                    class="slide-context-hero__bg"
                  />
                </div>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <video
    playsinline
    muted
    loop
    autoplay
    src="/files/ch-bg-2.mp4"
    class="context-hero__bg"
  ></video>
</section>
